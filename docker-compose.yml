name: rubygopher

# Shared block for the Rails containers (web + jobs) — a YAML extension field.
# web and jobs use the SAME image and environment; they differ only in command.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
    args:
      # Match the container user to the host user so generated files are editable.
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
  image: rubygopher_backend:dev
  volumes:
    - ./backend:/app:cached          # live code from the host
    - bundle_cache:/usr/local/bundle # gems survive container rebuilds
  environment: &backend_env
    RAILS_ENV: development
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_URL: redis://redis:6379/0
    RAILS_LOG_TO_STDOUT: "true"
  depends_on:
    db:
      condition: service_healthy     # wait until postgres actually accepts connections
    redis:
      condition: service_started
  networks:
    - rubygopher

services:
  web:
    <<: *backend
    # bundle check || bundle install — installs gems only if the lock changed (fast start).
    # Remove the stale pid so the container restarts without "server is already running".
    command: bash -c "bundle check || bundle install; rm -f tmp/pids/server.pid; bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      <<: *backend_env
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-dev-sandbox-token}
    ports:
      - "3000:3000"
    stdin_open: true                 # ┐ needed for the debugger (debug/binding.b)
    tty: true                        # ┘
    networks:
      - rubygopher
      - sandbox

  # Runs untrusted console snippets; every setting below is about containing them.
  # The Rails context boots the app from the read-only mounts against sandbox_db.
  sandbox:
    build:
      context: .
      dockerfile: services/sandboxd/Dockerfile
    image: rubygopher_sandboxd:dev
    read_only: true
    volumes:
      - ./backend:/app:ro
      - bundle_cache:/usr/local/bundle:ro
      - /dev/null:/app/config/master.key:ro   # the app code is mounted, the secrets are not
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/tmp:size=256m,mode=1777
      - /app/log:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-dev-sandbox-token}
      RAILS_ENV: development
      RAILS_MASTER_KEY_PATH: /nonexistent          # no credentials in the sandbox, by design
      SECRET_KEY_BASE: sandbox-only-not-a-secret
      DEVISE_JWT_SECRET_KEY: sandbox-only-not-a-secret
      DB_HOST: sandbox_db
      DB_USERNAME: console
      DB_PASSWORD: ${SANDBOX_CONSOLE_PASSWORD:-console}
    depends_on:
      sandbox_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sandboxd", "-check"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sandbox

  # Read-only copy of the development database for the console's Rails context.
  # Fill it with bin/sandbox-db-sync from the host.
  sandbox_db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox}
      POSTGRES_DB: rubygopher_development
      SANDBOX_CONSOLE_PASSWORD: ${SANDBOX_CONSOLE_PASSWORD:-console}
    volumes:
      - ./services/sandboxd/db-init:/docker-entrypoint-initdb.d:ro
      - sandbox_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sandbox

  frontend:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - rubygopher

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rubygopher_development
    ports:
      - "5432:5432"                  # exposed to the host — handy for psql/GUI clients
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rubygopher

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rubygopher

volumes:
  bundle_cache:
  postgres18_data:
  sandbox_pg_data:
  redis_data:
  frontend_node_modules:

networks:
  rubygopher:
  sandbox:
    internal: true                   # no gateway, no way out

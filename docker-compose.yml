name: rubygopher

# Shared block for the Rails containers (web + jobs) — a YAML extension field.
# web and jobs use the SAME image and environment; they differ only in command.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
    args:
      # Match the container user to the host user so generated files are editable.
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
  image: rubygopher_backend:dev
  volumes:
    - ./backend:/app:cached          # live code from the host
    - bundle_cache:/usr/local/bundle # gems survive container rebuilds
  environment: &backend_env
    RAILS_ENV: development
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_URL: redis://redis:6379/0
    RAILS_LOG_TO_STDOUT: "true"
  depends_on:
    db:
      condition: service_healthy     # wait until postgres actually accepts connections
    redis:
      condition: service_started
  networks:
    - rubygopher

services:
  web:
    <<: *backend
    # bundle check || bundle install — installs gems only if the lock changed (fast start).
    # Remove the stale pid so the container restarts without "server is already running".
    command: bash -c "bundle check || bundle install; rm -f tmp/pids/server.pid; bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      <<: *backend_env
      SANDBOX_URL: http://sandbox:8080
    ports:
      - "3000:3000"
    stdin_open: true                 # ┐ needed for the debugger (debug/binding.b)
    tty: true                        # ┘
    networks:
      - rubygopher
      - sandbox

  # Runs untrusted console snippets; every setting below is about containing them.
  sandbox:
    build:
      context: .
      dockerfile: services/sandboxd/Dockerfile
    image: rubygopher_sandboxd:dev
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sandbox

  jobs:
    <<: *backend
    command: bash -c "bundle check || bundle install; bundle exec sidekiq -C config/sidekiq.yml"

  css:
    <<: *backend
    command: bash -c "bundle check || bundle install; bin/rails dartsass:watch"

  frontend:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - rubygopher

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rubygopher_development
    ports:
      - "5432:5432"                  # exposed to the host — handy for psql/GUI clients
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rubygopher

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rubygopher

volumes:
  bundle_cache:
  postgres18_data:
  redis_data:
  frontend_node_modules:

networks:
  rubygopher:
  sandbox:
    internal: true                   # no gateway, no way out

# Periodic jobs, loaded by sidekiq-cron when the Sidekiq server boots.
# Jobs hold no logic: each calls one operation, and every operation is idempotent.
follow_up_reminders:
  cron: "*/10 * * * *"
  class: "Tracker::Jobs::FollowUpRemindersJob"
  queue: critical
  description: "Emit application.follow_up_due events for follow-ups that just became due"

outbox_sweep:
  cron: "* * * * *"
  class: "Outbox::Jobs::PublishJob"
  queue: critical
  description: "Publish outbox rows the after_commit relay missed (crash between commit and enqueue)"

close_stale_postings:
  cron: "15 4 * * *"
  class: "Aggregator::Jobs::CloseStalePostingsJob"
  queue: low
  description: "Deactivate postings no board has shown for a week"

purge_console_sessions:
  cron: "30 4 * * *"
  class: "Playground::Jobs::PurgeConsoleSessionsJob"
  queue: low
  description: "Delete shared console sessions idle for a week"

# Copy to a file outside git (or create the Secret with kubectl) and fill in real values:
#   kubectl -n rubygopher create secret generic rubygopher-secrets \
#     --from-literal=RAILS_MASTER_KEY=... --from-literal=DB_PASSWORD=... \
#     --from-literal=TELEGRAM_BOT_TOKEN=... --from-literal=HH_TOKEN=...
apiVersion: v1
kind: Secret
metadata:
  name: rubygopher-secrets
  namespace: rubygopher
type: Opaque
stringData:
  RAILS_MASTER_KEY: "contents of backend/config/master.key"
  DB_PASSWORD: "postgres password"
  TELEGRAM_BOT_TOKEN: ""
  HH_TOKEN: ""

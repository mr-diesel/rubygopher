apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rubygopher
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - migrate.yaml
  - web.yaml
  - jobs.yaml
  - karafka.yaml
  - fetcher.yaml
  - notifier.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: backend
    newName: registry.gitlab.com/mr-diesel/rubygopher/backend
    newTag: latest
  - name: frontend
    newName: registry.gitlab.com/mr-diesel/rubygopher/frontend
    newTag: latest
  - name: fetcher
    newName: registry.gitlab.com/mr-diesel/rubygopher/fetcher
    newTag: latest
  - name: notifier
    newName: registry.gitlab.com/mr-diesel/rubygopher/notifier
    newTag: latest

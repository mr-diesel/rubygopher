apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
    spec:
      containers:
        - name: notifier
          image: notifier
          envFrom:
            - configMapRef:
                name: rubygopher-config
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rubygopher-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
